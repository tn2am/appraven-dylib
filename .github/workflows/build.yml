name: Build and Release iOS Dylib

on:
  push:
    branches: [ "main", "master" ]
    tags: [ "v*" ]
  pull_request:
    branches: [ "main", "master" ]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: macos-14

    steps:
      - name: Checkout Source
        uses: actions/checkout@v4

      - name: Show Xcode & SDK Info
        run: |
          xcodebuild -version
          xcrun --sdk iphoneos --show-sdk-path

      - name: Compile Dylib
        run: |
          SDK_PATH=$(xcrun --sdk iphoneos --show-sdk-path)
          clang -arch arm64 \
                -isysroot "$SDK_PATH" \
                -miphoneos-version-min=15.0 \
                -dynamiclib \
                -fobjc-arc \
                -Wall -O2 \
                -framework Foundation \
                -framework UIKit \
                -lobjc \
                -o AppRavenPremiumMock.dylib \
                PremiumMock.m

      - name: Ad-hoc Codesign
        run: |
          codesign --force --sign - --entitlements entitlements.plist AppRavenPremiumMock.dylib
          file AppRavenPremiumMock.dylib

      - name: Compress Dylib
        run: |
          zip -9 AppRavenPremiumMock.zip AppRavenPremiumMock.dylib

      - name: Upload Artifact
        uses: actions/upload-artifact@v4
        with:
          name: AppRavenPremiumMock-dylib
          path: AppRavenPremiumMock.dylib

      - name: Publish GitHub Release
        if: startsWith(github.ref, 'refs/tags/') || github.ref == 'refs/heads/main'
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ startsWith(github.ref, 'refs/tags/') && github.ref_name || 'v2.0.0' }}
          name: ${{ startsWith(github.ref, 'refs/tags/') && github.ref_name || 'AppRaven Premium Mock v2.0.0' }}
          body: |
            ## 🚀 AppRaven Premium Mock Dylib

            ### 📦 Tải xuống (Direct Download):
            - **AppRavenPremiumMock.dylib**: Thư viện dylib (arm64, ad-hoc signed) dùng inject vào IPA AppRaven.
            - **AppRavenPremiumMock.zip**: Bản nén zip của file dylib.

            ### 🛠️ Cách tích hợp:
            1. Tải `AppRavenPremiumMock.dylib` về máy.
            2. Sử dụng Sideloadly / Scarlet / TrollStore hoặc script `inject.sh` để inject dylib vào file IPA AppRaven.
          files: |
            AppRavenPremiumMock.dylib
            AppRavenPremiumMock.zip
          draft: false
          prerelease: false
